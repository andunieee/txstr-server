[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
ritualistic = { path = "../ritualistic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = "0.8.11"
url = "2"
log = "0.4"
thiserror = "1"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
